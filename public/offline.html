<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal OS - Offline</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      background: #f7f7f5;
      color: #191a1d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      max-width: 500px;
      padding: 30px;
      text-align: center;
      background: white;
      border-radius: 14px;
      border: 1px solid #e5e5e1;
      box-shadow: 0 1px 2px rgba(19, 21, 26, 0.05);
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px;
      color: #202125;
    }
    p {
      font-size: 14px;
      color: #81868e;
      margin: 0 0 20px;
      line-height: 1.5;
    }
    button {
      background: #202125;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #34363c;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">📴</div>
    <h1>You're offline</h1>
    <p>Personal OS works best with an internet connection. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
